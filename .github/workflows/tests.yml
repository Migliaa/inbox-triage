name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-base.txt
      # The tests replace both models with fixed answers, so the decision model
      # and its heavy dependencies are not installed here.
      - run: pip install -r requirements-base.txt
      - run: python -m pytest -q
