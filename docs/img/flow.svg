<path d="M410,115 L445,115 L445,75 L478,75" fill="none" stroke="#16263d" stroke-width="1.5" marker-end="url(#tip)"/>
<path d="M410,155 L445,155 L445,220 L478,220" fill="none" stroke="#16263d" stroke-width="1.5" marker-end="url(#tip)"/>
<path d="M630,75 L653,75" fill="none" stroke="#16263d" stroke-width="1.5" marker-end="url(#tip)"/>
<path d="M820,75 L843,75" fill="none" stroke="#16263d" stroke-width="1.5" marker-end="url(#tip)"/>
<path d="M1010,75 L1033,75" fill="none" stroke="#16263d" stroke-width="1.5" marker-end="url(#tip)"/>
<path d="M555,190 L555,112" fill="none" stroke="#16263d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tip)"/>
<text x="438" y="70" font-size="12" fill="#51607a" text-anchor="end">top label ≥ 0.90</text>
<text x="438" y="208" font-size="12" fill="#51607a" text-anchor="end">uncertain · injection · spam</text>
<text x="565" y="155" font-size="12" fill="#51607a">a person can give the label</text>
<rect x="20" y="300" width="800" height="30" rx="6" fill="#f5f6f8" stroke="#9aa7bb"/><text x="420.0" y="320" text-anchor="middle" font-size="12.5" fill="#16263d">read token only</text>
<rect x="845" y="300" width="340" height="30" rx="6" fill="#fff4dc" stroke="#9aa7bb"/><text x="1015.0" y="320" text-anchor="middle" font-size="12.5" fill="#16263d">write token, only after an approval</text>
<rect x="20" y="345" width="1165" height="30" rx="6" fill="#eef3fb" stroke="#9aa7bb"/><text x="602.5" y="365" text-anchor="middle" font-size="12.5" fill="#16263d">LangSmith: one trace per email — decision, draft, human verdict</text>
<rect x="20" y="390" width="1165" height="30" rx="6" fill="#ffffff" stroke="#9aa7bb"/><text x="602.5" y="410" text-anchor="middle" font-size="12.5" fill="#16263d">GitHub Actions: the tests on the gate, the tokens and the failures run on every push</text>
